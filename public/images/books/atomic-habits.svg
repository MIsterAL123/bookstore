  <title id="title">Atomic Habits</title>
  <desc id="desc">Cover orisinal dengan orbit atom dan titik-titik kebiasaan.</desc>
  <rect width="800" height="1200" fill="#f4efe6"/>
  <rect x="0" y="0" width="800" height="1200" fill="none" stroke="#152d3f" stroke-width="26"/>
  <g transform="translate(400 555) rotate(-18)">
    <ellipse rx="250" ry="106" fill="none" stroke="#e07a5f" stroke-width="14"/>
